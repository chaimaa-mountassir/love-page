<!DOCTYPE html>
<html>
<head>
  <title>Secret Message ❤️</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#000,#2b001f);
      font-family:Arial;
      overflow:hidden;
      color:white;
    }

    .box{
      text-align:center;
      background:rgba(255,255,255,0.1);
      padding:40px;
      border-radius:20px;
      backdrop-filter:blur(10px);
      box-shadow:0 0 20px #ff4d6d;
    }

    input{
      width:250px;
      padding:10px;
      margin:10px;
      border:none;
      border-radius:10px;
      outline:none;
      text-align:center;
    }

    button{
      padding:10px 20px;
      border:none;
      border-radius:10px;
      background:#ff4d6d;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    h1{
      color:#ff4d6d;
    }

    .heart{
      position:absolute;
      color:#ff4d6d;
      animation:float 6s linear infinite;
    }

    @keyframes float{
      0%{transform:translateY(100vh);}
      100%{transform:translateY(-10vh);}
    }
  </style>
</head>

<body>

<div class="box" id="formBox">
  <h1>❤️ Secret Questions ❤️</h1>

  <p>When did we start dating?</p>
  <input type="date" id="q1">

  <p>When is my birthday? </p>
  <input type="date" id="q2">

  <p>What is my favorite color?</p>
  <input type="text" id="q3">

  <br><br>

  <button onclick="checkAnswers()">Unlock ❤️</button>
</div>

<script>

function checkAnswers(){

  let a1 = document.getElementById("q1").value;
  let a2 = document.getElementById("q2").value;
  let a3 = document.getElementById("q3").value.toLowerCase();

  if(a1 === "2021-10-23" && a2 === "2004-08-28" && a3 === "bleu"){

    document.getElementById("formBox").innerHTML = `
      <h1>❤️ Hey ❤️</h1>

      <p style="font-size:24px;">
        You are my comfort, my happiness,  
        and the best thing that ever happened to me 💖
      </p>

      <p style="font-size:22px;">
        Even on bad days...  
        you make everything feel better 🥺
      </p>

      <h2>I love you more than words can explain ❤️</h2>
    `;

    startHearts();

  } else {
    alert("Wrong answers 😢");
  }
}

function startHearts(){

  setInterval(()=>{

    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },6000);

  },300);
}

</script>

</body>
</html>
